services:
  ingest:
    build: 
      context: .
      dockerfile: castelia-ingest/Dockerfile
    env_file:
      - ./.env
    ports:
      - "1935:1935"
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    ports:
      - "5432:5432"
