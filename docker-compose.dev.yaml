services:
  auth:
    build: 
      context: .
      dockerfile: castelia-auth/Dockerfile
    env_file:
      ./.env
    environment:
      - DATABASE_URL=postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB
    ports:
      - "3000:3000"
    depends_on: [db]

  ingest:
    build: 
      context: .
      dockerfile: castelia-ingest/Dockerfile
    environment:
      - AUTH_URL=http://auth:3000
    ports:
      - "1935:1935"
    depends_on: [auth]

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    ports:
      - "5432:5432"
