services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:8086"
      - "--entryPoints.rtmp.address=:1935"
      - "--accesslog=true"
    ports:
      - "8080:8080"
      - "8086:8086"
      - "1935:1935"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  auth:
    build: 
      context: .
      dockerfile: castelia-auth/Dockerfile
    env_file:
      ./.env
    environment:
      - DATABASE_URL=postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB
    ports:
      - "3000:3000"
    depends_on: 
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth/`)"
      - "traefik.http.middlewares.auth-strip.stripprefix.prefixes=/auth"
      - "traefik.http.routers.auth.middlewares=auth-strip"

  broadcast:
    build:
      context: .
      dockerfile: castelia-broadcast/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - HLS_OUTPUT_DIR=/hls
      - RUST_LOG=trace
    volumes:
      - hls:/hls

  ingest:
    build: 
      context: .
      dockerfile: castelia-ingest/Dockerfile
    environment:
      - AUTH_URL=http://auth:3000
      - REDIS_URL=redis://redis
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.ingest-router.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.ingest-router.entrypoints=rtmp"

  transcoder:
    build:
      context: .
      dockerfile: castelia-transcoder/Dockerfile
    environment:
      - REDIS_URL=redis://redis
      - HLS_OUTPUT_DIR=/hls
      - RUST_LOG=trace
    depends_on:
      - redis
    volumes:
      - hls:/hls

  redis:
    image: redis:8.4

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql

volumes:
  db:
  hls:
