services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:8086"
      - "--entryPoints.rtmp.address=:1935"
      - "--accesslog=true"
    ports:
      - "8086:8086"
      - "1935:1935"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  web:
    build: castelia-web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"

  auth:
    build: 
      context: .
      dockerfile: castelia-auth/Dockerfile
    env_file:
      ./.env
    environment:
      - DATABASE_URL=postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB
    depends_on: 
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth/`)"
      - "traefik.http.middlewares.auth-strip.stripprefix.prefixes=/auth"
      - "traefik.http.routers.auth.middlewares=auth-strip"

  broadcast:
    build:
      context: .
      dockerfile: castelia-broadcast/Dockerfile
    environment:
      - HLS_OUTPUT_DIR=/hls
      - DATABASE_URL=postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB
      - AUTH_URL=http://auth:3000
      - REDIS_URL=redis://redis
    volumes:
      - hls:/hls
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.broadcasts.rule=PathPrefix(`/broadcasts`)"
    depends_on:
      - redis
      - db

  ingest:
    build: 
      context: .
      dockerfile: castelia-ingest/Dockerfile
    environment:
      - AUTH_URL=http://auth:3000
      - REDIS_URL=redis://redis
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.ingest-router.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.ingest-router.entrypoints=rtmp"
    depends_on:
      - redis

  transcoder:
    build:
      context: .
      dockerfile: castelia-transcoder/Dockerfile
    environment:
      - REDIS_URL=redis://redis
      - HLS_OUTPUT_DIR=/hls
    depends_on:
      - redis
    volumes:
      - hls:/hls

  redis:
    image: redis:8.4

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    volumes:
      - db:/var/lib/postgresql

volumes:
  db:
  hls:
